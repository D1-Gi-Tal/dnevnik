<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дневник тренировок</title>
<meta name="theme-color" content="#0F0E1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Дневник">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F0E1A;--card:#1A1830;--tile:#1F1C38;--nav:#141226;--sheet:#141226;--stage:#0F0E1A;
  --border:#2C2950;--border2:#4A4675;--text:#F4F3FF;--body:#CFCCEA;--muted:#A9A6C9;
  --indigo:#5B4BFF;--indigoText:#A79DFF;--pink:#FF4F98;--pinkText:#FF8CBC;--pinkSoft:#3A1B33;
  --ghost:#5B5590;--equip:#4A4675;--line:#2C2950;--figure:#F4F3FF;--ok:#4ADE80;--scrim:rgba(5,4,12,.72);
}
body.light{
  --bg:#F6F5FF;--card:#FFFFFF;--tile:#F3F1FF;--nav:#FFFFFF;--sheet:#FFFFFF;--stage:#F6F5FF;
  --border:#E4E1F7;--border2:#C9C4EA;--text:#17153A;--body:#3A375E;--muted:#5D5A80;
  --indigo:#4B3FD8;--indigoText:#4B3FD8;--pink:#E0347A;--pinkText:#C2185B;--pinkSoft:#FDE6F0;
  --ghost:#B7B0EA;--equip:#C9C4EA;--line:#E4E1F7;--figure:#17153A;--ok:#15803D;--scrim:rgba(40,36,80,.45);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.screen{flex:1;padding:calc(18px + env(safe-area-inset-top)) 16px 96px;display:flex;flex-direction:column;gap:16px}
h1,.disp{font-family:'Unbounded',sans-serif}
h1{margin:0;font-size:24px;line-height:30px;font-weight:700}
.sec-t{margin:0;font-family:'Unbounded',sans-serif;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px 14px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chip.ind.on{background:var(--indigo);border-color:var(--indigo)}
.tag{font-size:12px;font-weight:700;color:#fff;background:var(--pink);padding:5px 10px;border-radius:6px}
.iconbtn{all:unset;cursor:pointer;width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);flex:none}
.iconbtn:focus-visible,.chip:focus-visible,.btn:focus-visible,.ex:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.progress{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress>div{height:6px;background:var(--indigo)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.tile.need{border:1.5px dashed var(--pink);color:var(--pinkText)}
.tile input{all:unset;width:100%;min-height:28px;font:700 17px 'Unbounded',sans-serif;color:var(--text)}
.tile input::placeholder{color:var(--muted);opacity:.7}
.check{display:flex;align-items:center;gap:12px;min-height:44px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border);cursor:pointer}
.check:last-child{border-bottom:none}
.check input{width:22px;height:22px;accent-color:var(--indigo);margin:0;flex:none}
.check.done span{color:var(--muted);text-decoration:line-through}
.ex{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:var(--card);border:1px solid var(--border);box-sizing:border-box}
.ex.cur{border:1.5px solid var(--pink)}
.ex .num{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);flex:none}
.ex.done .num{background:var(--indigo);border-color:var(--indigo)}
.ex.cur .num{background:var(--pinkSoft);border-color:var(--pinkSoft);color:var(--pinkText)}
.ex .nm{font-size:15px;font-weight:700}
.ex .pl{font-size:12px;color:var(--muted)}
.ex .fact{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;color:var(--indigoText);text-align:right;flex:none;max-width:110px}
.ex .fact.empty{font-family:'Inter';font-weight:600;color:var(--muted)}
.ex .fact.next{font-family:'Inter';font-size:12px;color:var(--pinkText)}
.grouphead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--pinkText);margin-top:4px}
.field{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.inp{height:46px;background:var(--tile);border:1.5px solid var(--border);border-radius:12px;font:700 17px 'Unbounded',sans-serif;color:var(--text);text-align:center;width:100%;padding:0 6px}
.inp.l{text-align:left;font:500 15px 'Inter',sans-serif;padding:0 12px}
.inp:focus{outline:none;border-color:var(--indigo)}
textarea.inp{height:64px;padding:10px 12px;text-align:left;font:500 14px 'Inter',sans-serif;resize:vertical}
select.inp{font:600 14px 'Inter',sans-serif;text-align:left;padding:0 10px;appearance:auto}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{all:unset;cursor:pointer;min-height:50px;border-radius:14px;background:var(--indigo);color:#fff;font-family:'Unbounded',sans-serif;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 16px;box-sizing:border-box;text-align:center}
.btn.sec{background:var(--tile);color:var(--text);border:1px solid var(--border)}
.btn.pink{background:var(--pink)}
.btn.small{min-height:40px;font-size:11px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--nav);border-top:1px solid var(--border);z-index:5}
nav.tabs .in{max-width:480px;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
nav.tabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;justify-content:center;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button.on{color:var(--indigoText);font-weight:700}
.modal{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:480px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;border-top:1px solid var(--border);padding:14px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--tile);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.stat b{font-family:'Unbounded',sans-serif;font-size:16px}
.stage{background:var(--stage);border:1px solid var(--border);border-radius:16px;padding:6px 12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.legend{display:flex;gap:14px;font-size:11px;font-weight:600;color:var(--muted);flex-wrap:wrap;justify-content:center}
.tech{margin:0;padding-left:18px;font-size:14px;line-height:20px;color:var(--body);display:flex;flex-direction:column;gap:3px}
.hint{margin:0;font-size:13px;font-weight:700;color:var(--pinkText)}
.banner{background:var(--pinkSoft);color:var(--pinkText);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:14px}
.chart{width:100%;height:auto;display:block}
.seg{display:flex;background:var(--tile);border-radius:12px;padding:4px;gap:4px}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;min-height:38px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--indigo);color:#fff}
.list-row{display:flex;align-items:center;gap:8px;min-height:48px;border-bottom:1px solid var(--border)}
.list-row:last-child{border-bottom:none}
.list-row .grow{flex:1;min-width:0}
.mini{all:unset;cursor:pointer;width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.mini:hover{background:var(--tile)}
.wd{all:unset;cursor:pointer;min-width:36px;height:34px;border-radius:9px;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin:2px}
.wd.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
details.card>summary{cursor:pointer;list-style:none;font-weight:700;font-size:15px;min-height:28px;display:flex;align-items:center;justify-content:space-between}
details.card>summary::-webkit-details-marker{display:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:40;max-width:90vw}
a{color:var(--indigoText)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<script>
"use strict";
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = (v) => { if (v === "" || v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const fmt = (v, d = 1) => v == null || v === "" ? "" : (Math.round(v * 10 ** d) / 10 ** d).toString().replace(".", ",");
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseIso = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseIso(s); d.setDate(d.getDate() + n); return iso(d); };
const WD = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
const WDF = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
const MON = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const wdIdx = (s) => (parseIso(s).getDay() + 6) % 7;
const human = (s) => { const d = parseIso(s); return WDF[wdIdx(s)] + ", " + d.getDate() + " " + MON[d.getMonth()]; };
const short = (s) => { const d = parseIso(s); return pad(d.getDate()) + "." + pad(d.getMonth() + 1); };

const clone = (o) => JSON.parse(JSON.stringify(o || {}));
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

function figSvg(key, t) {
  const f = FIGS[key]; if (!f) return "";
  const k = (1 - Math.cos(2 * Math.PI * t)) / 2;
  const P = f.a.p.map((q, i) => [q[0] + (f.b.p[i][0] - q[0]) * k, q[1] + (f.b.p[i][1] - q[1]) * k]);
  const H = [f.a.h[0] + (f.b.h[0] - f.a.h[0]) * k, f.a.h[1] + (f.b.h[1] - f.a.h[1]) * k];
  const pt = (p) => p[0].toFixed(1) + "," + p[1].toFixed(1);
  const chain = (pts, ch) => "M" + ch.map(i => pt(pts[i])).join(" L");
  const chains = (pts, list) => (list || []).map(ch => chain(pts, ch)).join(" ");
  let s = '<line x1="10" y1="100" x2="130" y2="100" stroke="var(--line)" stroke-width="1.5"/>';
  if (f.st) s += '<path d="' + f.st + '" fill="none" stroke="var(--equip)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  for (const pose of [f.a, f.b]) {
    s += '<path d="' + chains(pose.p, f.body) + '" fill="none" stroke="var(--ghost)" stroke-width="2.5" stroke-dasharray="3 4" stroke-linecap="round" stroke-linejoin="round"/>';
    s += '<circle cx="' + pose.h[0] + '" cy="' + pose.h[1] + '" r="7" fill="none" stroke="var(--ghost)" stroke-width="2" stroke-dasharray="3 3"/>';
  }
  if (f.eq) s += '<path d="' + chains(P, f.eq) + '" fill="none" stroke="var(--equip)" stroke-width="4" stroke-linecap="round"/>';
  if (f.plate != null) s += '<circle cx="' + P[f.plate][0].toFixed(1) + '" cy="' + P[f.plate][1].toFixed(1) + '" r="8" fill="none" stroke="var(--equip)" stroke-width="4"/>';
  if (f.db != null) { const [x, y] = P[f.db]; s += '<path d="M' + (x - 6).toFixed(1) + ',' + y.toFixed(1) + ' L' + (x + 6).toFixed(1) + ',' + y.toFixed(1) + ' M' + (x - 6).toFixed(1) + ',' + (y - 4).toFixed(1) + ' L' + (x - 6).toFixed(1) + ',' + (y + 4).toFixed(1) + ' M' + (x + 6).toFixed(1) + ',' + (y - 4).toFixed(1) + ' L' + (x + 6).toFixed(1) + ',' + (y + 4).toFixed(1) + '" stroke="var(--equip)" stroke-width="3.5" stroke-linecap="round"/>'; }
  s += '<path d="' + chains(P, f.body) + '" fill="none" stroke="var(--figure)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>';
  s += '<path d="' + chains(P, f.mus) + '" fill="none" stroke="var(--pink)" stroke-width="7" stroke-linecap="round" stroke-opacity="' + (0.25 + 0.75 * k).toFixed(2) + '"/>';
  s += '<circle cx="' + H[0].toFixed(1) + '" cy="' + H[1].toFixed(1) + '" r="7" fill="var(--figure)"/>';
  return s;
}

async function api(payload, c) {
  c = c || cfg(); if (!c) { const e = new Error("no_cfg"); e.code = "no_cfg"; throw e; }

  else r = await fetch(c.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ key: c.key }, payload)) });
  let j; try { j = await r.json(); } catch (e) { const er = new Error("bad_response"); er.code = "bad_response"; throw er; }
  if (!j.ok) { const e = new Error(j.message || j.error || "error"); e.code = j.error; throw e; }
  return j;
}

  try {
    while (Object.keys(OUTBOX).length) {
      const path = Object.keys(OUTBOX)[0]; const data = OUTBOX[path];
      setSync("saving");
      await api({ action: "set", path, data });
      if (OUTBOX[path] === data) { delete OUTBOX[path]; LS.set(K_OUT, OUTBOX); }
    }
    setSync("ok");
  } catch (e) { setSync(e.code === "bad_key" ? "badkey" : "offline"); }
  finally { flushing = false; }
}
function save(path, body) {

function types() { return (S.library && S.library.types) || []; }

function dayInfo(date) {
  const sch = S.schedule || {};
  const o = (sch.overrides || {})[date] || {};
  const week = sch.week || [];
  const slots = o.s || (sch.start && date < sch.start ? [] : week[wdIdx(date)]) || [];
  const deloadRange = deloads().some(r => r.from && r.to && date >= r.from && date <= r.to);
  const deload = o.deload != null ? !!o.deload : !!deloadRange;
  return { slots: slots.filter(Boolean), cycle: !!o.cycle, deload, override: !!o.s };
}
function deloads() {
  const st = S.settings || {}; const a = (st.deloads || []).slice();
  if (st.deloadFrom && st.deloadTo && !a.some(r => r.from === st.deloadFrom && r.to === st.deloadTo)) a.unshift({ from: st.deloadFrom, to: st.deloadTo });
  return a.sort((x, y) => x.from < y.from ? -1 : 1);

function roundTo(v, step) { if (!step) return v; return Math.round(v / step) * step; }
function planFor(date) {

  info.slots.forEach(tid => {
    const t = typeById(tid);
    exercises().filter(e => e.type === tid).forEach(e => {
      let sets = e.sets, w = e.weight;
      const red = e.reduce && (info.cycle || info.deload);
      if (red) {
        if (sets != null && sets !== "") sets = Math.max(1, sets - (info.cycle ? set("cycleSets") : 0) - (info.deload ? set("deloadSets") : 0));
        if (w != null && w !== "") w = roundTo(w * (1 - (info.cycle ? set("cyclePct") : 0)) * (1 - (info.deload ? set("deloadPct") : 0)), set("round"));
      }
      out.push(Object.assign({}, e, { pSets: sets, pW: w, typeName: t ? t.name : tid, kind: t ? t.kind : "", reduced: red }));
    });

  return { info, list: out };
}
function planText(p) {
  const parts = [];
  if (p.pW != null && p.pW !== "") parts.push(fmt(p.pW) + " кг");
  let sr = "";
  if (p.pSets != null && p.pSets !== "") sr = p.pSets + "×" + (p.reps || "");
  else if (p.reps) sr = p.reps;
  if (sr) parts.push(sr);
  return parts.join(" · ");
}
function isTimeKind(p) { return p.unit === "time"; }
function factText(f, p) {
  if (!f) return "";
  if (isTimeKind(p) || (f.min != null && f.w == null)) {
    const a = []; if (f.min != null) a.push(fmt(f.min, 0) + " мин"); if (f.km != null) a.push(fmt(f.km, 2) + " км"); if (f.hr != null) a.push("♥" + f.hr);
    return a.join(" · ") || (f.done ? "сделано" : "");
  }
  const a = [];
  if (f.w != null) a.push(fmt(f.w));
  if (f.s != null) a.push(f.s);
  if (f.r != null) a.push(fmt(f.r));

}
function hasFact(f) { return !!f && (f.w != null || f.s != null || f.r != null || f.min != null || f.done); }
function checklistFor(date) {
  const info = dayInfo(date);
  const kinds = info.slots.map(id => (typeById(id) || {}).kind);
  const training = kinds.some(k => k && k !== "rest");
  return ((S.checklist && S.checklist.items) || []).filter(it => {
    const r = it.rule || { kind: "daily" };
    if (r.kind === "daily") return true;
    if (r.kind === "days") return (r.days || []).includes(wdIdx(date));
    if (r.kind === "cond") {

function lineChart(series, opts) {

  series.forEach(sr => {

    const m = d.m || {}, s = d.sum || {};
    const doneTasks = Object.values(d.tasks || {}).filter(Boolean).length;
    mo.push([short(d.date) + "." + d.date.slice(0, 4), WD[wdIdx(d.date)], num(m.w), num(m.hr), num(m.sleep), num(m.knee), doneTasks || null, info.slots.map(id => (typeById(id) || { name: id }).name).join(" + "), info.cycle ? "да" : "", s.dur, s.hr, s.feel, s.note || ""]);
  });
  return { train: toCsv(tr), morning: toCsv(mo) };
}
function download(name, text, type) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportCsv() {
  const ex = buildExports();
  download("dnevnik-trenirovki.csv", "﻿" + ex.train, "text/csv");
  setTimeout(() => download("dnevnik-utro.csv", "﻿" + ex.morning, "text/csv"), 600);
}
function backup() { download("dnevnik-kopiya-" + iso(new Date()) + ".json", JSON.stringify({ docs: DOCS }, null, 1), "application/json"); }
async function importFile(file) {
  const out = $("#exp-out"); let docs;
  try { const j = JSON.parse(await file.text()); docs = j.docs || j; if (!docs || typeof docs !== "object") throw 0; }
  catch (e) { out.textContent = "Файл не читается — нужен .json из резервной копии."; return; }
  const keys = Object.keys(docs).filter(p => /^(app|days)\/[\w\-]+$/.test(p));
  if (!keys.length) { out.textContent = "В файле нет данных дневника."; return; }
  const clean = {}; keys.forEach(k => clean[k] = docs[k]);
  out.textContent = "Загружаю " + keys.length + " записей…";
  try { await api({ action: "import", docs: clean }); await pull(); render(); toast("Загружено записей: " + keys.length); }
  catch (e) { out.textContent = "Не удалось загрузить: " + errText(e); }
}
function errText(e) {
  const c = e && e.code;
  return c === "bad_key" ? "ключ не совпадает с TOKEN в скрипте"
    : c === "token_not_set" ? "в скрипте не вписан TOKEN"
    : c === "bad_response" ? "скрипт ответил не то — проверь, что доступ «Все» и адрес заканчивается на /exec"
    : c === "server_error" ? "ошибка в скрипте: " + (e.message || "")
    : "нет связи со скриптом — проверь адрес и интернет";
}
function renderSetup() {
  const c = cfg() || {};
  let h = '<h1>Подключение</h1><p class="muted" style="margin:0;font-size:14px;line-height:20px">Вставь адрес веб-приложения Google Apps Script и ключ (TOKEN) из скрипта. Это делается один раз на каждом устройстве.</p>';
  h += '<label class="field">Адрес скрипта (заканчивается на /exec)<input class="inp l" id="cfg-url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(c.url || "") + '"></label>';
  h += '<label class="field">Ключ<input class="inp l" id="cfg-key" autocomplete="off" value="' + esc(c.key || "") + '"></label>';
  h += '<button class="btn" data-act="savecfg">Подключить</button>';
  if (cfg()) h += '<button class="btn sec" data-act="cancelsetup">Отмена</button>';
  h += '<div id="cfg-out" class="small" style="color:var(--pinkText)"></div>';
  return h;
}
async function saveCfg() {
  const url = $("#cfg-url").value.trim(), key = $("#cfg-key").value.trim(), out = $("#cfg-out");
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { out.textContent = "Адрес должен начинаться с https://script.google.com/ и заканчиваться на /exec"; return; }
  if (!key) { out.textContent = "Впиши ключ"; return; }
  out.textContent = "Проверяю…";
  try {
    await api({ action: "all" }, { url, key });
    LS.set(K_CFG, { url, key }); S.tab = "today"; out.textContent = "";
    await pull(); render(); toast("Подключено");
  } catch (e) { out.textContent = "Не получилось: " + errText(e); }
}

/* ================= events ================= */
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-act],[data-ex],[data-range],[data-theme],[data-wd],[data-calday]");
  if (!t) return;
  if (t.dataset.calday) { S.date = t.dataset.calday; closeModal(); render(); return; }
  if (t.dataset.wd != null) { t.classList.toggle("on"); t.setAttribute("aria-pressed", t.classList.contains("on")); return; }
  if (t.dataset.ex) { openExercise(t.dataset.ex); return; }
  if (t.dataset.range != null) { S.statsRange = +t.dataset.range; render(); return; }
  if (t.dataset.theme) { saveDoc("settings", Object.assign({}, S.settings || {}, { theme: t.dataset.theme })); render(); return; }
  const a = t.dataset.act, id = t.dataset.id;
  if (a === "backdrop") { if (ev.target === t) closeModal(); return; }
  const map = {
    theme: () => { saveDoc("settings", Object.assign({}, S.settings || {}, { theme: set("theme") === "light" ? "dark" : "light" })); render(); },
    prev: () => { S.date = addDays(S.date, -1); render(); }, next: () => { S.date = addDays(S.date, 1); render(); }, todaybtn: () => { S.date = iso(new Date()); render(); },
    cal: openCalendar, calprev: () => calShift(-1), calnext: () => calShift(1), calgotoday: () => { S.date = iso(new Date()); closeModal(); render(); },
    adddl: () => { const f = $("#dl-from").value, to = $("#dl-to").value; if (!f || !to || to < f) { toast("Выбери даты: «с» раньше «по»"); return; } saveDeloads(deloads().concat([{ from: f, to }])); render(); },
    deldl: () => { const a = deloads(); a.splice(+id, 1); saveDeloads(a); render(); },
    cycle: toggleCycle, editday: openEditDay, saveday: saveDayPlan, resetday: resetDayPlan, close: closeModal,
    savefact: () => saveFact(id), clearfact: () => clearFact(id),
    editex: () => openEditEx(id), addex: () => openEditEx(null, t.dataset.type), saveex: () => saveEx(id), delex: () => delEx(id), exup: () => moveEx(id, -1), exdown: () => moveEx(id, 1),
    edittype: () => openEditType(id), addtype: () => openEditType(null), savetype: () => saveType(id), deltype: () => delType(id),
    edittask: () => openEditTask(id), addtask: () => openEditTask(null), savetask: () => saveTask(id), deltask: () => delTask(id),
    csv: exportCsv, backup: backup, syncnow: () => { pull(); toast("Обновляю…"); },
    setup: () => { S.tab = "setup"; render(); window.scrollTo(0, 0); }, cancelsetup: () => { S.tab = "settings"; render(); }, savecfg: saveCfg
  };
  if (map[a]) map[a]();
});
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && $("#modal-root .modal")) closeModal(); });
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.dataset.task) { const on = t.checked; saveDay(S.date, d => { d.tasks = d.tasks || {}; if (on) d.tasks[t.dataset.task] = true; else delete d.tasks[t.dataset.task]; }); t.closest(".check").classList.toggle("done", on); return; }
  if (t.dataset.field) {
    const [grp, key] = t.dataset.field.split(".");
    const v = key === "note" ? (t.value.trim() || null) : num(t.value);
    saveDay(S.date, d => { d[grp] = d[grp] || {}; if (v == null) delete d[grp][key]; else d[grp][key] = v; });
    const tile = t.closest(".tile"); if (tile) tile.classList.toggle("need", v == null);
    return;
  }
  if (t.dataset.week) {
    const [di, si] = t.dataset.week.split(":").map(Number); const s = scheduleCopy(); freezePast(s); const row = (s.week[di] || []).slice(); row[si] = t.value; s.week[di] = row.filter((x, i) => x || i < si).filter(Boolean); saveDoc("schedule", s); return;
  }
  if (t.dataset.set) {
    const k = t.dataset.set; let v = t.type === "date" ? (t.value || null) : num(t.value);
    if ((k === "cyclePct" || k === "deloadPct") && v != null) v = v / 100;
    saveDoc("settings", Object.assign({}, S.settings || {}, { [k]: v })); return;
  }
  if (t.id === "statsEx") { S.statsEx = t.value; render(); }
  if (t.id === "imp-file" && t.files && t.files[0]) importFile(t.files[0]);
});

/* ================= boot ================= */
let rerenderPending = false;
function softRender() {
  // avoid clobbering what the person is typing or a modal
  const ae = document.activeElement;
  if ($("#modal-root .modal") || (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && $("#screen").contains(ae))) { rerenderPending = true; return; }
  render();
}
document.addEventListener("focusout", () => { if (rerenderPending) { setTimeout(() => { if (rerenderPending && !$("#modal-root .modal")) { const ae = document.activeElement; if (!(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) { rerenderPending = false; render(); } } }, 50); } });
function boot() {
  applyDocs(); S.sheetUrl = LS.get(K_SHEET, null); S.ready = true;
  if (Object.keys(OUTBOX).length) S.sync = "offline";
  render();
  if (cfg()) pull();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && cfg()) pull(); });
  window.addEventListener("online", () => flush());
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
boot();
